name: SQL Migration Chain

on:
  pull_request:
  workflow_dispatch:

# Only test the latest revision of a PR; stale migration runs can block the current proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-chain:
    name: Apply migrations on clean PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aghbari_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aghbari_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: aghbari_migration_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Bootstrap minimal Supabase Auth contract
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text UNIQUE,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT SELECT ON auth.users TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated, service_role;
          -- Mirror Supabase's default public-table/sequence grants; row-level policies remain
          -- the authorization boundary, and migrations can explicitly revoke sensitive writes.
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          SQL

      - name: Apply all repository migrations in filename order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "::group::Applying $migration"
            psql --set ON_ERROR_STOP=1 --file "$migration"
            echo "::endgroup::"
          done

      - name: Verify tenant policy hardening and company onboarding
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          DO $tenant_security_contract$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public' AND left(policyname, 5) = 'anon_'
            ) THEN
              RAISE EXCEPTION 'legacy permissive anon_* row policies remain';
            END IF;
            IF has_table_privilege('anon', 'public.organizations', 'INSERT')
              OR has_table_privilege('authenticated', 'public.organizations', 'INSERT') THEN
              RAISE EXCEPTION 'organizations may be inserted directly by browser roles';
            END IF;
            IF has_table_privilege('anon', 'public.organization_members', 'INSERT')
              OR has_table_privilege('authenticated', 'public.organization_members', 'INSERT')
              OR has_table_privilege('authenticated', 'public.organization_members', 'UPDATE')
              OR has_table_privilege('authenticated', 'public.organization_members', 'DELETE') THEN
              RAISE EXCEPTION 'browser roles can mutate organization memberships directly';
            END IF;
            IF has_table_privilege('anon', 'public.orders', 'SELECT')
              OR has_table_privilege('anon', 'public.invoices', 'SELECT')
              OR has_table_privilege('authenticated', 'public.orders', 'INSERT')
              OR has_table_privilege('authenticated', 'public.orders', 'UPDATE')
              OR has_table_privilege('authenticated', 'public.orders', 'DELETE')
              OR has_table_privilege('authenticated', 'public.order_items', 'INSERT')
              OR has_table_privilege('authenticated', 'public.invoices', 'INSERT')
              OR has_table_privilege('authenticated', 'public.payments', 'INSERT') THEN
              RAISE EXCEPTION 'orders/billing must be tenant-only reads and privileged RPC writes';
            END IF;
            IF has_table_privilege('anon', 'public.audit_logs', 'SELECT')
              OR has_table_privilege('anon', 'public.outbox_events', 'SELECT') THEN
              RAISE EXCEPTION 'audit and outbox tables must not grant public reads';
            END IF;
            IF has_table_privilege('authenticated', 'public.order_status_history', 'INSERT')
              OR has_table_privilege('authenticated', 'public.order_status_history', 'UPDATE')
              OR has_table_privilege('authenticated', 'public.order_status_history', 'DELETE')
              OR has_table_privilege('authenticated', 'public.audit_logs', 'INSERT')
              OR has_table_privilege('authenticated', 'public.audit_logs', 'UPDATE')
              OR has_table_privilege('authenticated', 'public.outbox_events', 'INSERT')
              OR has_table_privilege('authenticated', 'public.outbox_events', 'DELETE') THEN
              RAISE EXCEPTION 'audit/outbox/order history must be immutable to browser roles';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.organizations
              WHERE status = 'pending' AND is_active = true
            ) THEN
              RAISE EXCEPTION 'legacy active organizations were incorrectly downgraded to pending';
            END IF;
            IF has_function_privilege('anon', 'public.create_organization_for_current_user(text,text,text)', 'EXECUTE')
              OR NOT has_function_privilege('authenticated', 'public.create_organization_for_current_user(text,text,text)', 'EXECUTE')
              OR has_function_privilege('anon', 'public.is_platform_admin()', 'EXECUTE')
              OR NOT has_function_privilege('authenticated', 'public.is_platform_admin()', 'EXECUTE')
              OR has_function_privilege('anon', 'public.list_pending_organizations()', 'EXECUTE')
              OR NOT has_function_privilege('authenticated', 'public.list_pending_organizations()', 'EXECUTE')
              OR has_function_privilege('anon', 'public.review_organization(uuid,text,text)', 'EXECUTE')
              OR NOT has_function_privilege('authenticated', 'public.review_organization(uuid,text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'organization onboarding/review RPC grants are incorrect';
            END IF;
            IF has_table_privilege('authenticated', 'public.user_roles', 'INSERT')
              OR has_table_privilege('authenticated', 'public.user_roles', 'UPDATE')
              OR has_table_privilege('authenticated', 'public.user_roles', 'DELETE') THEN
              RAISE EXCEPTION 'browser roles can grant global platform administrator privileges';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'organizations'
                AND column_name = 'status' AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION 'legacy organizations table lacks required status column';
            END IF;
          END
          $tenant_security_contract$;

          INSERT INTO auth.users (id, email)
          VALUES ('a2000000-0000-4000-8000-000000000099', 'aghbari-ci-org-create@example.invalid');

          SELECT set_config('request.jwt.claim.sub', 'a2000000-0000-4000-8000-000000000099', false);
          SET ROLE authenticated;
          DO $org_creation_smoke$
          DECLARE
            v_org_id uuid;
            v_replay_id uuid;
            v_status text;
            v_is_active boolean;
            v_can_operate boolean;
            v_role text;
            v_membership_status text;
          BEGIN
            v_org_id := public.create_organization_for_current_user(
              'Aghbari CI Onboarding Company', 'aghbari-ci-org-create@example.invalid', '+967700000099'
            );
            v_replay_id := public.create_organization_for_current_user(
              'Aghbari CI Onboarding Company', 'aghbari-ci-org-create@example.invalid', '+967700000099'
            );
            IF v_org_id IS DISTINCT FROM v_replay_id THEN
              RAISE EXCEPTION 'organization onboarding retry created a duplicate tenant';
            END IF;

            SELECT o.status, o.is_active, om.role, om.status
              INTO v_status, v_is_active, v_role, v_membership_status
            FROM public.organizations o
            JOIN public.organization_members om ON om.organization_id = o.id
            WHERE o.id = v_org_id AND om.user_id = auth.uid();

            IF v_status <> 'pending' OR v_is_active OR v_role <> 'owner' OR v_membership_status <> 'active' THEN
              RAISE EXCEPTION 'onboarding must create an inactive pending organization and active owner membership';
            END IF;

            v_can_operate := private.is_org_member(v_org_id);
            IF v_can_operate THEN
              RAISE EXCEPTION 'pending organization received active tenant access before approval';
            END IF;

            IF public.is_platform_admin() THEN
              RAISE EXCEPTION 'ordinary new tenant must not be a platform administrator';
            END IF;
            v_can_operate := false;
            BEGIN
              PERFORM 1 FROM public.list_pending_organizations();
            EXCEPTION WHEN raise_exception THEN
              v_can_operate := true;
            END;
            IF NOT v_can_operate THEN
              RAISE EXCEPTION 'tenant owner can list platform-wide pending organizations';
            END IF;

          END
          $org_creation_smoke$;
          RESET ROLE;

          DO $organization_audit_smoke$
          DECLARE
            v_audit_count integer;
          BEGIN
            SELECT count(*) INTO v_audit_count
            FROM public.audit_logs
            WHERE organization_id = (
              SELECT id FROM public.organizations
              WHERE email = 'aghbari-ci-org-create@example.invalid'
            )
              AND action = 'organization.created'
              AND entity_type = 'organization'
              AND entity_id = (
                SELECT id FROM public.organizations
                WHERE email = 'aghbari-ci-org-create@example.invalid'
              );
            IF v_audit_count <> 1 THEN
              RAISE EXCEPTION 'organization creation must write exactly one audit record atomically';
            END IF;
          END
          $organization_audit_smoke$;

          -- Seed a catalog row under the migration owner. An unapproved tenant must neither
          -- read it through the base table/staff view nor write a product of its own.
          INSERT INTO public.products (
            id, organization_id, name, item_code, sku, name_ar, slug, unit,
            base_price, price, bulk_price, retail_price, wholesale_price,
            stock_quantity, min_order_qty, box_quantity, carton_quantity, is_active, status
          )
          SELECT
            'a4000000-0000-4000-8000-000000000097', id, 'CI Pending Tenant Product',
            'CI-PENDING-001', 'CI-PENDING-001', 'صنف مؤسسة معلقة',
            'ci-pending-tenant-product', 'piece',
            10, 10, 10, 10, 10, 3, 1, 1, 1, false, 'active'
          FROM public.organizations WHERE email = 'aghbari-ci-org-create@example.invalid';

          SELECT set_config('request.jwt.claim.sub', 'a2000000-0000-4000-8000-000000000099', false);
          SET ROLE authenticated;
          DO $pending_tenant_catalog_gate$
          DECLARE
            v_count integer;
            v_write_denied boolean := false;
          BEGIN
            SELECT count(*) INTO v_count FROM public.products
            WHERE id = 'a4000000-0000-4000-8000-000000000097';
            IF v_count <> 0 THEN
              RAISE EXCEPTION 'unapproved tenant can read catalog rows before approval';
            END IF;

            SELECT count(*) INTO v_count FROM public.admin_product_catalog
            WHERE id = 'a4000000-0000-4000-8000-000000000097';
            IF v_count <> 0 THEN
              RAISE EXCEPTION 'unapproved tenant can read the privileged pricing view';
            END IF;

            BEGIN
              INSERT INTO public.products (
                organization_id, name, item_code, sku, name_ar, slug, unit, status, is_active
              ) VALUES (
                'a0000000-0000-4000-8000-000000000099',
                'Unauthorized Pending Product', 'CI-PENDING-DENIED', 'CI-PENDING-DENIED',
                'منتج مرفوض', 'ci-pending-denied-product', 'piece', 'active', true
              );
            EXCEPTION WHEN insufficient_privilege THEN
              v_write_denied := true;
            END;
            IF NOT v_write_denied THEN
              RAISE EXCEPTION 'unapproved tenant can create product rows before platform approval';
            END IF;
          END
          $pending_tenant_catalog_gate$;
          RESET ROLE;

          -- Also test rejection of a separate pending organization.
          INSERT INTO public.organizations (id, name, email, status, is_active)
          VALUES ('a1000000-0000-4000-8000-000000000097', 'Aghbari CI Rejected Company',
                  'aghbari-ci-org-reject@example.invalid', 'pending', false);

          -- A platform administrator is provisioned in the trusted test bootstrap, then uses
          -- the same audited RPC as the application to approve the tenant.
          INSERT INTO auth.users (id, email)
          VALUES ('a2000000-0000-4000-8000-000000000098', 'aghbari-ci-platform-admin@example.invalid');
          INSERT INTO public.profiles (auth_user_id, full_name, email, is_active)
          VALUES ('a2000000-0000-4000-8000-000000000098', 'Aghbari CI Platform Admin',
                  'aghbari-ci-platform-admin@example.invalid', true);
          INSERT INTO public.user_roles (profile_id, role)
          SELECT id, 'system_admin'
          FROM public.profiles
          WHERE auth_user_id = 'a2000000-0000-4000-8000-000000000098';

          SELECT set_config('request.jwt.claim.sub', 'a2000000-0000-4000-8000-000000000098', false);
          SET ROLE authenticated;
          DO $platform_approval_smoke$
          DECLARE
            v_org_id uuid;
            v_count integer;
            v_result jsonb;
            v_rejection_result jsonb;
            v_status text;
            v_is_active boolean;
          BEGIN
            IF public.is_platform_admin() IS NOT TRUE THEN
              RAISE EXCEPTION 'platform administrator role was not recognized';
            END IF;

            SELECT pending.id INTO v_org_id
            FROM public.list_pending_organizations() pending
            WHERE pending.email = 'aghbari-ci-org-create@example.invalid';

            SELECT count(*) INTO v_count
            FROM public.list_pending_organizations() pending
            WHERE pending.id = v_org_id;
            IF v_count <> 1 THEN
              RAISE EXCEPTION 'platform admin cannot see pending tenant in review queue';
            END IF;

            v_result := public.review_organization(v_org_id, 'approve', 'CI approval smoke test');
            IF v_result->>'status' <> 'active' OR v_result->>'is_active' <> 'true' THEN
              RAISE EXCEPTION 'platform approval RPC returned incorrect activation status';
            END IF;

            v_rejection_result := public.review_organization(
              'a1000000-0000-4000-8000-000000000097',
              'reject',
              'CI rejection smoke test'
            );
            IF v_rejection_result->>'status' <> 'inactive' OR v_rejection_result->>'is_active' <> 'false' THEN
              RAISE EXCEPTION 'platform rejection RPC returned incorrect inactive state';
            END IF;

          END
          $platform_approval_smoke$;
          RESET ROLE;

          DO $approved_tenant_fixture$
          DECLARE
            v_count integer;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.organizations
              WHERE email = 'aghbari-ci-org-create@example.invalid'
                AND status = 'active' AND is_active = true
            ) THEN RAISE EXCEPTION 'test tenant activation failed'; END IF;

            SELECT count(*) INTO v_count
            FROM public.audit_logs
            WHERE organization_id = (
              SELECT id FROM public.organizations
              WHERE email = 'aghbari-ci-org-create@example.invalid'
            )
              AND action = 'organization.approved';
            IF v_count <> 1 THEN RAISE EXCEPTION 'platform approval must write exactly one audit record'; END IF;

            SELECT count(*) INTO v_count
            FROM public.audit_logs
            WHERE organization_id = 'a1000000-0000-4000-8000-000000000097'
              AND action = 'organization.rejected';
            IF v_count <> 1 THEN RAISE EXCEPTION 'platform rejection must write exactly one audit record'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM public.organizations
              WHERE id = 'a1000000-0000-4000-8000-000000000097'
                AND status = 'inactive' AND is_active = false
            ) THEN RAISE EXCEPTION 'platform rejection did not deactivate the company'; END IF;
          END
          $approved_tenant_fixture$;

          -- Build one row in the created tenant and one in a second tenant, then assert RLS.
          INSERT INTO public.organizations (id, name, email, currency, status)
          VALUES ('a1000000-0000-4000-8000-000000000099', 'Aghbari CI Other Tenant', 'other-tenant@example.invalid', 'YER', 'active');

          INSERT INTO public.products (
            id, organization_id, name, name_ar, item_code, sku, slug, unit,
            base_price, price, bulk_price, retail_price, wholesale_price,
            stock_quantity, min_order_qty, box_quantity, carton_quantity, status, is_active
          )
          SELECT
            'a4000000-0000-4000-8000-000000000099', id, 'CI Tenant A Product', 'صنف المؤسسة أ',
            'CI-TENANT-A-001', 'CI-TENANT-A-001', 'ci-tenant-a-product', 'piece',
            12, 12, 12, 12, 12, 8, 1, 1, 1, 'active', true
          FROM public.organizations WHERE email = 'aghbari-ci-org-create@example.invalid';

          INSERT INTO public.products (
            id, organization_id, name, name_ar, item_code, sku, slug, unit,
            base_price, price, bulk_price, retail_price, wholesale_price,
            stock_quantity, min_order_qty, box_quantity, carton_quantity, status, is_active
          )
          VALUES (
            'a4000000-0000-4000-8000-000000000098', 'a1000000-0000-4000-8000-000000000099',
            'CI Tenant B Product', 'صنف المؤسسة ب', 'CI-TENANT-B-001', 'CI-TENANT-B-001',
            'ci-tenant-b-product', 'piece', 22, 22, 22, 22, 22, 6, 1, 1, 1, 'active', true
          );

          INSERT INTO public.customers (id, organization_id, customer_code, business_name, tier, status)
          SELECT 'a7000000-0000-4000-8000-000000000099', id, 'CI-CUSTOMER-A-001', 'CI Tenant A Customer', 'wholesale', 'approved'
          FROM public.organizations WHERE email = 'aghbari-ci-org-create@example.invalid';

          INSERT INTO public.customers (id, organization_id, customer_code, business_name, tier, status)
          VALUES ('a7000000-0000-4000-8000-000000000098', 'a1000000-0000-4000-8000-000000000099',
                  'CI-CUSTOMER-B-001', 'CI Tenant B Customer', 'wholesale', 'approved');

          INSERT INTO public.addresses (id, organization_id, user_id, line1, city)
          SELECT 'a8000000-0000-4000-8000-000000000099', id,
                 'a2000000-0000-4000-8000-000000000099', 'CI Tenant A Address', 'Sana''a'
          FROM public.organizations WHERE email = 'aghbari-ci-org-create@example.invalid';
          INSERT INTO public.addresses (id, organization_id, user_id, line1, city)
          VALUES ('a8000000-0000-4000-8000-000000000098', 'a1000000-0000-4000-8000-000000000099',
                  'a2000000-0000-4000-8000-000000000099', 'CI Tenant B Address', 'Taiz');

          INSERT INTO public.reorder_templates (id, user_id, organization_id, name, items)
          SELECT 'a9000000-0000-4000-8000-000000000099',
                 'a2000000-0000-4000-8000-000000000099', id, 'CI Tenant A Reorder', '[]'::jsonb
          FROM public.organizations WHERE email = 'aghbari-ci-org-create@example.invalid';
          INSERT INTO public.reorder_templates (id, user_id, organization_id, name, items)
          VALUES ('a9000000-0000-4000-8000-000000000098',
                  'a2000000-0000-4000-8000-000000000099', 'a1000000-0000-4000-8000-000000000099',
                  'CI Tenant B Reorder', '[]'::jsonb);

          INSERT INTO public.price_tiers (organization_id, product_id, tier_price, min_quantity)
          SELECT o.id, 'a4000000-0000-4000-8000-000000000099', 9, 1
          FROM public.organizations o WHERE o.email = 'aghbari-ci-org-create@example.invalid';
          INSERT INTO public.price_tiers (organization_id, product_id, tier_price, min_quantity)
          VALUES ('a1000000-0000-4000-8000-000000000099',
                  'a4000000-0000-4000-8000-000000000098', 19, 1);

          SELECT set_config('request.jwt.claim.sub', 'a2000000-0000-4000-8000-000000000099', false);
          SET ROLE authenticated;
          DO $tenant_row_isolation$
          DECLARE
            v_count integer;
          BEGIN
            SELECT count(*) INTO v_count FROM public.products WHERE id = 'a4000000-0000-4000-8000-000000000099';
            IF v_count <> 1 THEN RAISE EXCEPTION 'tenant member cannot read own catalog'; END IF;

            SELECT count(*) INTO v_count FROM public.products WHERE id = 'a4000000-0000-4000-8000-000000000098';
            IF v_count <> 0 THEN RAISE EXCEPTION 'cross-tenant product row leaked'; END IF;

            SELECT count(*) INTO v_count FROM public.customers WHERE id = 'a7000000-0000-4000-8000-000000000099';
            IF v_count <> 1 THEN RAISE EXCEPTION 'tenant member cannot read own customer records'; END IF;

            SELECT count(*) INTO v_count FROM public.customers WHERE id = 'a7000000-0000-4000-8000-000000000098';
            IF v_count <> 0 THEN RAISE EXCEPTION 'cross-tenant customer record leaked'; END IF;

            IF has_column_privilege('authenticated', 'public.products', 'cost_price', 'SELECT')
              OR has_column_privilege('authenticated', 'public.products', 'retail_price', 'SELECT')
              OR has_column_privilege('authenticated', 'public.products', 'wholesale_price', 'SELECT')
              OR has_column_privilege('anon', 'public.products', 'cost_price', 'SELECT') THEN
              RAISE EXCEPTION 'financial product columns remain readable by browser roles';
            END IF;

            INSERT INTO public.cart_items (user_id, product_id, quantity, unit_type)
            VALUES (auth.uid(), 'a4000000-0000-4000-8000-000000000099', 1, 'piece');

            SELECT count(*) INTO v_count FROM public.addresses WHERE id = 'a8000000-0000-4000-8000-000000000099';
            IF v_count <> 1 THEN RAISE EXCEPTION 'tenant member cannot read own address'; END IF;
            SELECT count(*) INTO v_count FROM public.addresses WHERE id = 'a8000000-0000-4000-8000-000000000098';
            IF v_count <> 0 THEN RAISE EXCEPTION 'cross-tenant address leaked'; END IF;

            SELECT count(*) INTO v_count FROM public.reorder_templates WHERE id = 'a9000000-0000-4000-8000-000000000099';
            IF v_count <> 1 THEN RAISE EXCEPTION 'tenant owner cannot read own reorder template'; END IF;
            SELECT count(*) INTO v_count FROM public.reorder_templates WHERE id = 'a9000000-0000-4000-8000-000000000098';
            IF v_count <> 0 THEN RAISE EXCEPTION 'cross-tenant reorder template leaked'; END IF;

            SELECT count(*) INTO v_count FROM public.price_tiers WHERE organization_id = (
              SELECT id FROM public.organizations WHERE email = 'aghbari-ci-org-create@example.invalid'
            );
            IF v_count <> 1 THEN RAISE EXCEPTION 'tenant member cannot read own price tier'; END IF;
            SELECT count(*) INTO v_count FROM public.price_tiers WHERE organization_id = 'a1000000-0000-4000-8000-000000000099';
            IF v_count <> 0 THEN RAISE EXCEPTION 'cross-tenant price tier leaked'; END IF;

            v_count := 0;
            BEGIN
              INSERT INTO public.cart_items (user_id, product_id, quantity, unit_type)
              VALUES (auth.uid(), 'a4000000-0000-4000-8000-000000000098', 1, 'piece');
            EXCEPTION WHEN insufficient_privilege THEN v_count := 1;
            END;
            IF v_count <> 1 THEN RAISE EXCEPTION 'cross-tenant product was accepted into cart'; END IF;

            v_count := 0;
            BEGIN
              INSERT INTO public.wishlist_items (user_id, product_id)
              VALUES (auth.uid(), 'a4000000-0000-4000-8000-000000000098');
            EXCEPTION WHEN insufficient_privilege THEN v_count := 1;
            END;
            IF v_count <> 1 THEN RAISE EXCEPTION 'cross-tenant product was accepted into wishlist'; END IF;

            IF has_table_privilege('authenticated', 'public.order_status_history', 'INSERT')
              OR has_table_privilege('authenticated', 'public.order_status_history', 'UPDATE')
              OR has_table_privilege('authenticated', 'public.order_status_history', 'DELETE') THEN
              RAISE EXCEPTION 'browser roles can directly tamper with immutable order history';
            END IF;
          END
          $tenant_row_isolation$;
          RESET ROLE;
          SQL

      - name: Run order idempotency, quantity approval and payment workflow smoke test
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email)
          VALUES ('a2000000-0000-4000-8000-000000000001', 'aghbari-ci-smoke@example.invalid');

          INSERT INTO public.organizations (id, name, currency)
          VALUES ('a1000000-0000-4000-8000-000000000001', 'Aghbari CI Smoke Organization', 'YER');

          INSERT INTO public.profiles (id, auth_user_id, organization_id, full_name, email)
          VALUES (
            'a3000000-0000-4000-8000-000000000001',
            'a2000000-0000-4000-8000-000000000001',
            'a1000000-0000-4000-8000-000000000001',
            'Aghbari CI Smoke User',
            'aghbari-ci-smoke@example.invalid'
          );

          INSERT INTO public.organization_members (organization_id, user_id, role, status)
          VALUES (
            'a1000000-0000-4000-8000-000000000001',
            'a2000000-0000-4000-8000-000000000001',
            'owner',
            'active'
          );

          INSERT INTO public.customers (
            organization_id, profile_id, customer_code, business_name,
            tier, status, approved_at
          ) VALUES (
            'a1000000-0000-4000-8000-000000000001',
            'a3000000-0000-4000-8000-000000000001',
            'CI-CUSTOMER-001', 'Aghbari CI Customer',
            'wholesale', 'approved', now()
          );

          INSERT INTO public.products (
            id, organization_id, name, name_ar, item_code, sku, slug, unit,
            base_price, price, bulk_price, retail_price, wholesale_price,
            stock_quantity, min_order_qty, box_quantity, carton_quantity,
            status, is_active
          ) VALUES (
            'a4000000-0000-4000-8000-000000000001',
            'a1000000-0000-4000-8000-000000000001',
            'CI Smoke Product', 'صنف اختبار CI', 'CI-ITEM-001', 'CI-SKU-001',
            'ci-smoke-product', 'piece',
            10, 10, 10, 10, 10, 50, 1, 1, 1, 'active', true
          );

          INSERT INTO public.cart_items (user_id, product_id, quantity, unit_type)
          VALUES (
            'a2000000-0000-4000-8000-000000000001',
            'a4000000-0000-4000-8000-000000000001',
            2,
            'piece'
          );
          SQL

          psql --set ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub', 'a2000000-0000-4000-8000-000000000001', false);
          SET ROLE authenticated;

          DO $ci_order_smoke$
          DECLARE
            v_order_id uuid;
            v_replayed_order_id uuid;
            v_order_count integer;
            v_item_id uuid;
            v_payment_id uuid;
            v_replayed_payment_id uuid;
            v_payment_count integer;
            v_invoice_kind text;
            v_invoice_status text;
            v_order_status text;
            v_result jsonb;
            v_guard_hit boolean := false;
          BEGIN
            v_order_id := public.create_order_from_cart(
              '{"line1":"CI test address"}'::jsonb,
              '{"line1":"CI billing address"}'::jsonb,
              'CI transactional smoke test',
              'ci-order-idempotency-0001'
            );

            -- The cart has been cleared by successful order creation. A retry with the same
            -- key and same context must return the original order, not fail or create a duplicate.
            v_replayed_order_id := public.create_order_from_cart(
              '{"line1":"CI test address"}'::jsonb,
              '{"line1":"CI billing address"}'::jsonb,
              'CI transactional smoke test',
              'ci-order-idempotency-0001'
            );
            IF v_replayed_order_id IS DISTINCT FROM v_order_id THEN
              RAISE EXCEPTION 'order idempotency replay did not return the original order';
            END IF;

            SELECT count(*) INTO v_order_count
            FROM public.orders
            WHERE idempotency_key = 'ci-order-idempotency-0001';
            IF v_order_count <> 1 THEN
              RAISE EXCEPTION 'duplicate order created for one idempotency key';
            END IF;

            BEGIN
              PERFORM public.admin_update_order_status(v_order_id, 'approved');
              RAISE EXCEPTION 'expected_quantity_approval_guard_not_triggered';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'quantity_approval_required' THEN
                v_guard_hit := true;
              ELSE
                RAISE;
              END IF;
            END;
            IF NOT v_guard_hit THEN
              RAISE EXCEPTION 'approval guard did not reject an order without approved quantities';
            END IF;

            SELECT id INTO v_item_id
            FROM public.order_items
            WHERE order_id = v_order_id
            ORDER BY created_at, id
            LIMIT 1;
            IF v_item_id IS NULL THEN RAISE EXCEPTION 'order item missing'; END IF;

            PERFORM public.approve_order_quantities(
              v_order_id,
              jsonb_build_object(v_item_id::text, 2)
            );
            PERFORM public.admin_update_order_status(v_order_id, 'approved');

            v_guard_hit := false;
            BEGIN
              PERFORM public.admin_update_order_status(v_order_id, 'processing');
              RAISE EXCEPTION 'expected_payment_confirmation_guard_not_triggered';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'payment_confirmation_required' THEN
                v_guard_hit := true;
              ELSE
                RAISE;
              END IF;
            END;
            IF NOT v_guard_hit THEN
              RAISE EXCEPTION 'fulfillment guard did not reject an unpaid order';
            END IF;

            v_payment_id := public.submit_order_payment(
              v_order_id, 20, 'ci-payment-idempotency-0001',
              'transfer', 'CI-TRANSFER-REF-001', 'CI smoke payment'
            );
            v_replayed_payment_id := public.submit_order_payment(
              v_order_id, 20, 'ci-payment-idempotency-0001',
              'transfer', 'CI-TRANSFER-REF-001', 'CI smoke payment'
            );
            IF v_replayed_payment_id IS DISTINCT FROM v_payment_id THEN
              RAISE EXCEPTION 'payment idempotency replay did not return the original payment';
            END IF;

            SELECT count(*) INTO v_payment_count
            FROM public.payments
            WHERE invoice_id IN (
              SELECT id FROM public.invoices WHERE order_id = v_order_id
            );
            IF v_payment_count <> 1 THEN
              RAISE EXCEPTION 'duplicate payment created for one idempotency key';
            END IF;

            v_result := public.confirm_order_payment(
              v_payment_id, true, 'CI smoke payment confirmed'
            );

            SELECT i.invoice_kind, i.status, o.status
              INTO v_invoice_kind, v_invoice_status, v_order_status
            FROM public.invoices i
            JOIN public.orders o ON o.id = i.order_id
            WHERE o.id = v_order_id;

            IF v_invoice_kind <> 'sales' OR v_invoice_status <> 'paid' OR v_order_status <> 'processing' THEN
              RAISE EXCEPTION 'payment confirmation did not finalize invoice and transition order';
            END IF;
          END;
          $ci_order_smoke$;

          RESET ROLE;
          SQL

      - name: Run purchasing, receiving, inventory transfer, stock count and expense smoke test
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.organizations (id, name, currency)
          VALUES ('a1000000-0000-4000-8000-000000000002', 'Aghbari CI Isolation Organization', 'YER');
          INSERT INTO public.suppliers (id, organization_id, supplier_code, name, status)
          VALUES ('a5000000-0000-4000-8000-000000000001',
                  'a1000000-0000-4000-8000-000000000001',
                  'CI-SUPPLIER-001', 'Aghbari CI Test Supplier', 'active');
          INSERT INTO public.warehouses (id, organization_id, name, code, is_active)
          VALUES
            ('a6000000-0000-4000-8000-000000000001','a1000000-0000-4000-8000-000000000001','CI Main Warehouse','CI-WH-1',true),
            ('a6000000-0000-4000-8000-000000000002','a1000000-0000-4000-8000-000000000001','CI Secondary Warehouse','CI-WH-2',true);
          INSERT INTO public.inventory_balances
            (product_id, warehouse_id, quantity_on_hand, quantity_reserved)
          VALUES
            ('a4000000-0000-4000-8000-000000000001','a6000000-0000-4000-8000-000000000001',20,0),
            ('a4000000-0000-4000-8000-000000000001','a6000000-0000-4000-8000-000000000002',0,0)
          ON CONFLICT (product_id, warehouse_id) DO UPDATE
          SET quantity_on_hand = EXCLUDED.quantity_on_hand,
              quantity_reserved = EXCLUDED.quantity_reserved,
              updated_at = now();
          SQL

          psql --set ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub', 'a2000000-0000-4000-8000-000000000001', false);
          SET ROLE authenticated;

          DO $ci_inventory_smoke$
          DECLARE
            v_org uuid := 'a1000000-0000-4000-8000-000000000001';
            v_other_org uuid := 'a1000000-0000-4000-8000-000000000002';
            v_product uuid := 'a4000000-0000-4000-8000-000000000001';
            v_supplier uuid := 'a5000000-0000-4000-8000-000000000001';
            v_wh1 uuid := 'a6000000-0000-4000-8000-000000000001';
            v_wh2 uuid := 'a6000000-0000-4000-8000-000000000002';
            v_purchase uuid;
            v_purchase_item uuid;
            v_receipt uuid;
            v_transfer uuid;
            v_count uuid;
            v_stale_count uuid;
            v_expense uuid;
            v_statement_id uuid;
            v_statement_replay_id uuid;
            v_stock1 numeric(15,3);
            v_stock2 numeric(15,3);
            v_status text;
            v_guard_hit boolean := false;
            v_result jsonb;
          BEGIN
            v_purchase := public.create_purchase_order(
              v_org, v_supplier, v_wh1,
              jsonb_build_array(jsonb_build_object('product_id',v_product,'quantity_ordered',5,'unit_cost',3.25)),
              'CI purchase-to-receipt smoke test'
            );
            SELECT id INTO v_purchase_item FROM public.purchase_order_items
            WHERE purchase_order_id = v_purchase;
            IF v_purchase_item IS NULL THEN RAISE EXCEPTION 'purchase order line was not persisted'; END IF;

            v_receipt := public.receive_purchase_order(
              v_org, v_purchase, v_wh1,
              jsonb_build_array(jsonb_build_object('purchase_order_item_id',v_purchase_item,'quantity',2)),
              'CI partial receipt'
            );
            IF v_receipt IS NULL THEN RAISE EXCEPTION 'partial receipt did not return a reference'; END IF;
            SELECT quantity_on_hand INTO v_stock1 FROM public.inventory_balances
            WHERE product_id=v_product AND warehouse_id=v_wh1;
            IF v_stock1 <> 22 THEN RAISE EXCEPTION 'partial receiving did not atomically increase stock'; END IF;

            PERFORM public.receive_purchase_order(
              v_org, v_purchase, v_wh1,
              jsonb_build_array(jsonb_build_object('purchase_order_item_id',v_purchase_item,'quantity',3)),
              'CI complete receipt'
            );
            SELECT status INTO v_status FROM public.purchase_orders WHERE id=v_purchase;
            IF v_status <> 'received' THEN RAISE EXCEPTION 'purchase order did not transition to received'; END IF;
            SELECT quantity_on_hand INTO v_stock1 FROM public.inventory_balances
            WHERE product_id=v_product AND warehouse_id=v_wh1;
            IF v_stock1 <> 25 THEN RAISE EXCEPTION 'complete receiving balance is incorrect'; END IF;

            v_transfer := public.create_inventory_transfer(
              v_org, v_wh1, v_wh2,
              jsonb_build_array(jsonb_build_object('product_id',v_product,'quantity',4)),
              'CI atomic transfer'
            );
            v_result := public.post_inventory_transfer(v_org,v_transfer);
            SELECT quantity_on_hand INTO v_stock1 FROM public.inventory_balances WHERE product_id=v_product AND warehouse_id=v_wh1;
            SELECT quantity_on_hand INTO v_stock2 FROM public.inventory_balances WHERE product_id=v_product AND warehouse_id=v_wh2;
            IF v_stock1 <> 21 OR v_stock2 <> 4 THEN RAISE EXCEPTION 'transfer did not atomically update both warehouse balances'; END IF;
            IF (SELECT status FROM public.inventory_transfers WHERE id=v_transfer) <> 'posted' THEN
              RAISE EXCEPTION 'transfer status was not posted';
            END IF;

            v_count := public.create_stock_count(
              v_org, v_wh1,
              jsonb_build_array(jsonb_build_object('product_id',v_product,'counted_quantity',20)),
              'CI stock count'
            );
            v_result := public.post_stock_count(v_org,v_count);
            SELECT quantity_on_hand INTO v_stock1 FROM public.inventory_balances WHERE product_id=v_product AND warehouse_id=v_wh1;
            IF v_stock1 <> 20 THEN RAISE EXCEPTION 'stock count did not reconcile the counted balance'; END IF;

            v_stale_count := public.create_stock_count(
              v_org, v_wh1,
              jsonb_build_array(jsonb_build_object('product_id',v_product,'counted_quantity',19)),
              'CI stale snapshot must be rejected'
            );
            UPDATE public.inventory_balances SET quantity_on_hand=quantity_on_hand+1
            WHERE product_id=v_product AND warehouse_id=v_wh1;
            v_guard_hit := false;
            BEGIN
              PERFORM public.post_stock_count(v_org,v_stale_count);
              RAISE EXCEPTION 'expected_stale_stock_count_guard_not_triggered';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'stock_changed_since_count' THEN v_guard_hit := true; ELSE RAISE; END IF;
            END;
            IF NOT v_guard_hit THEN RAISE EXCEPTION 'stale stock snapshot was not rejected'; END IF;

            v_expense := public.record_expense(v_org,'operations','CI expense smoke test',12.50,'YER',current_date);
            IF NOT EXISTS (SELECT 1 FROM public.expenses WHERE id=v_expense AND amount=12.50) THEN
              RAISE EXCEPTION 'expense was not persisted';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.audit_logs WHERE entity_type='expense' AND entity_id=v_expense) THEN
              RAISE EXCEPTION 'expense audit record is missing';
            END IF;

            v_statement_id := public.generate_organization_statement(v_org, current_date - 1, current_date);
            v_statement_replay_id := public.generate_organization_statement(v_org, current_date - 1, current_date);
            IF v_statement_replay_id IS DISTINCT FROM v_statement_id THEN
              RAISE EXCEPTION 'statement generation is not idempotent for one organization and period';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.statements
              WHERE id=v_statement_id AND organization_id=v_org
                AND period_start=current_date - 1 AND period_end=current_date
                AND closing_balance = opening_balance + total_invoiced - total_paid
            ) THEN
              RAISE EXCEPTION 'generated account statement snapshot is missing or inconsistent';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.audit_logs
              WHERE entity_type='statement' AND entity_id=v_statement_id AND action='statement.generated'
            ) THEN
              RAISE EXCEPTION 'statement audit record is missing';
            END IF;

            v_guard_hit := false;
            BEGIN
              PERFORM public.create_inventory_transfer(
                v_other_org, v_wh1, v_wh2,
                jsonb_build_array(jsonb_build_object('product_id',v_product,'quantity',1)),
                'cross-tenant request must be rejected'
              );
              RAISE EXCEPTION 'expected_cross_tenant_guard_not_triggered';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'inventory_transfer_forbidden' THEN v_guard_hit := true; ELSE RAISE; END IF;
            END;
            IF NOT v_guard_hit THEN RAISE EXCEPTION 'cross-tenant transfer request was not rejected'; END IF;
          END;
          $ci_inventory_smoke$;

          RESET ROLE;
          SQL

      - name: Verify tenant isolation and product-price column privileges
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email)
          VALUES ('a2000000-0000-4000-8000-000000000002', 'aghbari-ci-other@example.invalid')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.profiles (id, auth_user_id, organization_id, full_name, email)
          VALUES (
            'a3000000-0000-4000-8000-000000000002',
            'a2000000-0000-4000-8000-000000000002',
            'a1000000-0000-4000-8000-000000000002',
            'Aghbari CI Other Tenant User',
            'aghbari-ci-other@example.invalid'
          )
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.customers (
            organization_id, profile_id, customer_code, business_name, tier, status
          ) VALUES (
            'a1000000-0000-4000-8000-000000000002',
            'a3000000-0000-4000-8000-000000000002',
            'CI-CUSTOMER-OTHER', 'Other Tenant Customer', 'wholesale', 'approved'
          )
          ON CONFLICT (organization_id, customer_code) DO NOTHING;

          SELECT set_config('request.jwt.claim.sub', 'a2000000-0000-4000-8000-000000000001', false);
          SET ROLE authenticated;

          DO $ci_tenant_price_boundary$
          DECLARE
            v_same_org_customers integer;
            v_other_org_customers integer;
            v_admin_catalog_own integer;
            v_admin_catalog_other integer;
          BEGIN
            SELECT count(*) INTO v_same_org_customers
            FROM public.customers
            WHERE organization_id = 'a1000000-0000-4000-8000-000000000001';
            IF v_same_org_customers < 1 THEN
              RAISE EXCEPTION 'active organization member cannot read same-tenant customer records';
            END IF;

            SELECT count(*) INTO v_other_org_customers
            FROM public.customers
            WHERE organization_id = 'a1000000-0000-4000-8000-000000000002';
            IF v_other_org_customers <> 0 THEN
              RAISE EXCEPTION 'customer RLS exposes another tenant''s customer records';
            END IF;

            IF has_column_privilege('anon', 'public.products', 'base_price', 'SELECT')
               OR has_column_privilege('anon', 'public.products', 'cost_price', 'SELECT')
               OR has_column_privilege('authenticated', 'public.products', 'base_price', 'SELECT')
               OR has_column_privilege('authenticated', 'public.products', 'cost_price', 'SELECT') THEN
              RAISE EXCEPTION 'product financial columns remain directly selectable by browser roles';
            END IF;

            IF NOT has_column_privilege('anon', 'public.products', 'name', 'SELECT')
               OR NOT has_column_privilege('authenticated', 'public.products', 'sku', 'SELECT') THEN
              RAISE EXCEPTION 'safe product catalog columns were accidentally revoked';
            END IF;

            SELECT count(*) INTO v_admin_catalog_own
            FROM public.admin_product_catalog
            WHERE organization_id = 'a1000000-0000-4000-8000-000000000001';
            IF v_admin_catalog_own < 1 THEN
              RAISE EXCEPTION 'tenant staff cannot read their authorized admin product catalog';
            END IF;

            SELECT count(*) INTO v_admin_catalog_other
            FROM public.admin_product_catalog
            WHERE organization_id = 'a1000000-0000-4000-8000-000000000002';
            IF v_admin_catalog_other <> 0 THEN
              RAISE EXCEPTION 'admin product catalog view exposes another tenant';
            END IF;
          END;
          $ci_tenant_price_boundary$;

          RESET ROLE;
          SQL

      - name: Verify required post-migration contracts
        run: |
          psql --set ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.commerce_policy_settings') IS NULL THEN
              RAISE EXCEPTION 'commerce_policy_settings missing';
            END IF;
            IF to_regclass('public.import_profiles') IS NULL
               OR to_regclass('public.import_uploads') IS NULL
               OR to_regclass('public.import_records') IS NULL THEN
              RAISE EXCEPTION 'unified import tables missing';
            END IF;
            IF to_regclass('public.customer_order_summaries') IS NULL
               OR to_regclass('public.customer_order_item_summaries') IS NULL
               OR to_regclass('public.customer_sales_invoice_summaries') IS NULL
               OR to_regclass('public.customer_payment_summaries') IS NULL THEN
              RAISE EXCEPTION 'customer-safe views missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname='public' AND p.proname='approve_order_quantities'
            ) THEN RAISE EXCEPTION 'quantity approval RPC missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname='public' AND p.proname='confirm_order_payment'
            ) THEN RAISE EXCEPTION 'payment confirmation RPC missing'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname='public'
                AND p.proname='calculate_commerce_price'
                AND has_function_privilege('authenticated', p.oid, 'EXECUTE')
            ) THEN RAISE EXCEPTION 'authenticated can execute internal price calculator'; END IF;
          END $$;
          SQL
